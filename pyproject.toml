[project]
name = "thread-room"
version = "0.5.0"
description = "Multi-agent + human meetings on the filesystem (thread.jsonl)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "MakiDevelop", email = "noreply@users.noreply.github.com" }]
keywords = ["agents", "cli", "multi-agent", "thread", "trp", "codex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/MakiDevelop/thread-room"
Repository = "https://github.com/MakiDevelop/thread-room"
Issues = "https://github.com/MakiDevelop/thread-room/issues"
Changelog = "https://github.com/MakiDevelop/thread-room/blob/main/CHANGELOG.md"
Documentation = "https://github.com/MakiDevelop/thread-room/blob/main/docs/TRP.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "build>=1.2", "twine>=5.0"]

[project.scripts]
thread-room = "thread_room.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thread_room = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
